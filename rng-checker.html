<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>乱数調整 - 星のカービィ ウルトラスーパーデラックス</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<ul>
		<li id="corkboard">コルクボードの曲から乱数を特定する<ul>
				<li class="input">
					<button>コルクボード</button>
					<button>裏コルクボード</button>
					<button>?</button>
					<input type="search">
				</li>
				<li class="output"></li>
			</ul>
		</li>
		<li id="heavy-lobster">ヘビーロブスターの乱数調整<ul>
				<li class="input">
					<input type="search"><button>+</button><button>-</button>
					<table>
						<tr>
							<td><button>↖</button>
							<td><button>↑</button>
							<td><button>↗</button>
						<tr>
							<td><button>←</button>
							<td><button>?</button>
							<td><button>→</button>
						<tr>
							<td><button>↙</button>
							<td><button>↓</button>
							<td><button>↘</button>
					</table>
				</li>
			</ul>
			<table class="spaced">
				<tr>
					<td>
					<td>進める量
					<td>飛ぶ確率
					<td>進める上限
				<tr class="preFight">
					<th>戦うまでに
					<td class="advance">
					<td class="probability">
					<td><input type="number">
				<tr class="postDash">
					<th>走ったら
					<td class="advance">
					<td class="probability">
					<td><input type="number">
				<tr class="postWalk">
					<th>歩いたら
					<td class="advance">
					<td class="probability">
					<td><input type="number">
			</table>
		</li>
	</ul>
	<script type="module">

		import { Corkboard, HeavyLobster, Star, rngAt, randiAt } from './rng.mjs';

		const toHex = (num, len = 8) => (num >>> 0).toString(16).padStart(len, "0").toUpperCase();

		const numToChar = n => n < 0 ? '?' : n.toString(36);
		const charsToPattern = s => s.split('').map(c => {
			let n = parseInt(c, 36);
			return isNaN(n) ? -1 : n;
		});
		const charsToArrow = s => s.replace(/[^↑↗→↘↓↙←↖+-]/g, m => {
			const nums = "89632147wedcxzaqWEDCXZAQ";
			const idx = nums.indexOf(m);
			return idx < 0 ? '?' : Star.names[idx % 8];
		});
		const changeInputText = (input, s) => {
			let sav = input.selectionStart;
			input.value = s;
			input.setSelectionRange(sav, sav);
		}

		// --- Modular Setup Functions ---

		function setupCorkboard() {
			const input = document.querySelector('#corkboard .input input');
			const output = document.querySelector('#corkboard .output');

			const update = () => {
				let pattern = input.value.replace(/[^01]/g, '?');
				changeInputText(input, pattern)
				pattern = charsToPattern(input.value);

				//不明でない値が8個未満なら何も表示しない
				if (pattern.reduce((sum, x) => sum + (0 > x ? 0 : 1), 0) < 8) {
					output.textContent = '';
					return;
				}

				//可能性のある乱数を検索
				let rslt = Corkboard.search(pattern);

				//出力
				output.textContent = ["count=" + rslt.length, ...rslt.map(n => {
					let first = n - 2;
					let last = first + pattern.length * 2;
					return '[' + first + ']=' + rngAt(first) + '..[' + last + ']=' + rngAt(last);
				})].join(', ');
			};

			input.oninput = update;

			document.querySelectorAll('#corkboard .input button').forEach(el => {
				const c = numToChar(Corkboard.names.indexOf(el.textContent));
				el.onclick = _ => {
					input.value += c;
					update();
				}
			});
		}

		function setupHeavyLobster() {
			const input = document.querySelector('#heavy-lobster .input input');
			const nodes = {
				preFightAdvance: document.querySelector('#heavy-lobster .preFight .advance'),
				postDashAdvance: document.querySelector('#heavy-lobster .postDash .advance'),
				postWalkAdvance: document.querySelector('#heavy-lobster .postWalk .advance'),
				preFightProbability: document.querySelector('#heavy-lobster .preFight .probability'),
				postDashProbability: document.querySelector('#heavy-lobster .postDash .probability'),
				postWalkProbability: document.querySelector('#heavy-lobster .postWalk .probability'),
				preFightAdvanceMax: document.querySelector('#heavy-lobster .preFight input'),
				postDashAdvanceMax: document.querySelector('#heavy-lobster .postDash input'),
				postWalkAdvanceMax: document.querySelector('#heavy-lobster .postWalk input'),
			};

			// Load settings
			let preFightAdvanceMax = Number(localStorage.getItem('HeavyLobster.preFightAdvanceMax')) || 31;
			let postDashAdvanceMax = Number(localStorage.getItem('HeavyLobster.postDashAdvanceMax')) || 7;
			let postWalkAdvanceMax = Number(localStorage.getItem('HeavyLobster.postWalkAdvanceMax')) || 11;

			nodes.preFightAdvanceMax.value = preFightAdvanceMax;
			nodes.postDashAdvanceMax.value = postDashAdvanceMax;
			nodes.postWalkAdvanceMax.value = postWalkAdvanceMax;

			const update = () => {
				// Update settings from inputs
				preFightAdvanceMax = Number(nodes.preFightAdvanceMax.value);
				postDashAdvanceMax = Number(nodes.postDashAdvanceMax.value);
				postWalkAdvanceMax = Number(nodes.postWalkAdvanceMax.value);

				//数字を矢印に
				let patternText = charsToArrow(input.value);
				changeInputText(input, patternText)

				//矢印を数値に
				let additions = [0];
				let pattern = patternText.split('').flatMap(x => {
					switch (x) {
						case '+':
							additions[additions.length - 1]++;
							return [];
						case '-':
							additions[additions.length - 1]--;
							return [];
						default:
							additions.push(0);
							return [Star.names.indexOf(x)];
					}
				});

				//5文字未満なら結果を非表示にして終わり
				if (pattern.length < 5) {
					nodes.preFightAdvance.textContent = '';
					nodes.postDashAdvance.textContent = '';
					nodes.postWalkAdvance.textContent = '';
					nodes.preFightProbability.textContent = '';
					nodes.postDashProbability.textContent = '';
					nodes.postWalkProbability.textContent = '';
					return;
				}

				console.log(pattern, additions)
				//乱数をいくつ進めるか計算
				let search = HeavyLobster.search(pattern, additions);

				// Calculate with options
				let calc = HeavyLobster.calc(search, {
					preFightAdvanceMax,
					postDashAdvanceMax,
					postWalkAdvanceMax
				});

				//出力
				nodes.preFightAdvance.textContent = calc.advances;
				nodes.postDashAdvance.textContent = calc.postDash.advances;
				nodes.postWalkAdvance.textContent = calc.postWalk.advances;
				nodes.preFightProbability.textContent = (calc.postDash.jumpChance + calc.postWalk.jumpChance) + '/' + (calc.postDash.jumpChance + calc.postWalk.jumpChance + calc.postDash.glideChance + calc.postWalk.glideChance);
				nodes.postDashProbability.textContent = calc.postDash.jumpChance + '/' + (calc.postDash.jumpChance + calc.postDash.glideChance);
				nodes.postWalkProbability.textContent = calc.postWalk.jumpChance + '/' + (calc.postWalk.jumpChance + calc.postWalk.glideChance);
			};

			input.oninput = update;

			document.querySelectorAll('#heavy-lobster .input button').forEach(el => {
				el.onclick = _ => {
					input.value += el.textContent;
					update();
				}
			});

			// Save on unload inside setup or globally if preferred, here inside setup captures the scoped vars
			window.addEventListener('beforeunload', () => {
				localStorage.setItem('HeavyLobster.preFightAdvanceMax', preFightAdvanceMax);
				localStorage.setItem('HeavyLobster.postDashAdvanceMax', postDashAdvanceMax);
				localStorage.setItem('HeavyLobster.postWalkAdvanceMax', postWalkAdvanceMax);
			});
		}

		// Initialize
		setupCorkboard();
		setupHeavyLobster();

	</script>
</body>

</html>
