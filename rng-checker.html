<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>乱数調整 - 星のカービィ ウルトラスーパーデラックス</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<ul>
		<li id="corkboard">コルクボードの曲から乱数を特定する<ul>
				<li class="input">
					<button>コルクボード</button>
					<button>裏コルクボード</button>
					<button>?</button>
					<input type="search">
				</li>
				<li class="output"></li>
			</ul>
		</li>
		<li id="arena">格闘王への道のボスの順番の予測<ul>
				<li class="input">1戦目: <select><option value="-1">---</option></select>
					<label><input type="radio" name="arena-mode" value="Arena" checked>格闘王への道</label>
					<label><input type="radio" name="arena-mode" value="TrueArena">真・格闘王への道</label>
				</li>
				<li class="output"></li>
			</ul>
		</li>
		<li id="heavy-lobster">ヘビーロブスターの乱数調整<ul>
				<li class="input">
					<input type="search"><button>+</button><button>-</button>
					<table>
						<tr>
							<td><button>↖</button>
							<td><button>↑</button>
							<td><button>↗</button>
						<tr>
							<td><button>←</button>
							<td><button>?</button>
							<td><button>→</button>
						<tr>
							<td><button>↙</button>
							<td><button>↓</button>
							<td><button>↘</button>
					</table>
				</li>
			</ul>
			<table class="spaced">
				<tr>
					<td>
					<td>進める量
					<td>進める上限
				<tr class="preFight">
					<th>戦うまでに
					<td class="advances">
					<td><input type="number">
				<tr class="postDash">
					<th>走ったら
					<td class="advances">
					<td><input type="number">
				<tr class="postWalk">
					<th>歩いたら
					<td class="advances">
					<td><input type="number">
			</table>
		</li>
	</ul>
	<script type="module">

		import { Corkboard, HeavyLobster, Star, Arena, TrueArena, rngAt } from './rng.mjs';

		const numToChar = n => n < 0 ? '?' : n.toString(36);
		const charsToPattern = s => s.split('').map(c => {
			let n = parseInt(c, 36);
			return isNaN(n) ? -1 : n;
		});
		const charsToArrow = s => s.replace(/[^↑↗→↘↓↙←↖+-]/g, m => {
			const nums = "89632147wedcxzaqWEDCXZAQ";
			const idx = nums.indexOf(m);
			return idx < 0 ? '?' : Star.NAMES[idx % 8];
		});
		const changeInputText = (input, s) => {
			let sav = input.selectionStart;
			input.value = s;
			input.setSelectionRange(sav, sav);
		}

		let corkboardResults = [];
		let updateArena = () => {};

		function setupCorkboard() {
			const input = document.querySelector('#corkboard .input input');
			const output = document.querySelector('#corkboard .output');

			const update = () => {
				let pattern = input.value.replace(/[^01]/g, '?');
				changeInputText(input, pattern)
				pattern = charsToPattern(input.value);

				//不明でない値が8個未満なら何も表示しない
				if (pattern.reduce((sum, x) => sum + (0 > x ? 0 : 1), 0) < 8) {
					output.textContent = '';
					corkboardResults = [];
					updateArena();
					return;
				}

				//可能性のある乱数を検索
				let rslt = Corkboard.search(pattern);
				corkboardResults = rslt.map(r => r.current);
				updateArena();

				//出力
				output.textContent = ["count=" + rslt.length, ...rslt.map(r =>
					'[' + r.i + ']=' + rngAt(r.i) + '..[' + r.current + ']=' + rngAt(r.current)
				)].join(', ');
			};
			input.oninput = e => e.isComposing || update();
			addEventListener('compositionend', update)

			document.querySelectorAll('#corkboard .input button').forEach(el => {
				const c = numToChar(Corkboard.NAMES.indexOf(el.textContent));
				el.onclick = _ => {
					input.value += c;
					update();
				}
			});
		}

		function setupArena() {
			const modeRadios = document.querySelectorAll('#arena input[name="arena-mode"]');
			const select = document.querySelector('#arena select');
			const output = document.querySelector('#arena .output');

			//現在のモードを取得
			const getArena = () => {
				for(const radio of modeRadios){
					if(radio.checked){
						return {
							"Arena": Arena,
							"TrueArena": TrueArena,
						}[radio.value];
					}
				}
			};

			//ボス選択肢の更新
			const updateBossList = () => {
				const arena = getArena();
				select.innerHTML = '<option value="-1">---</option>';
				for (let i = 0; i < arena.SHUFFLE_LEN; i++) {
					const opt = document.createElement('option');
					opt.value = i;
					opt.textContent = arena.NAMES[i];
					select.appendChild(opt);
				}
			};

			//予測結果の表示
			const update = () => {
				const firstBoss = parseInt(select.value);
				if (firstBoss < 0 || corkboardResults.length === 0) {
					output.textContent = '';
					return;
				}

				const arena = getArena();
				const results = arena.searchBossOrder(corkboardResults, firstBoss);

				if (results.length === 0) {
					output.textContent = '該当なし';
					return;
				}

				//重複するオーダーを除去
				const unique = [...new Map(results.map(r => [r.join(), r])).values()];

				output.style.whiteSpace = 'pre-line';
				output.textContent = 'パターン数: ' + unique.length + '\n' +
					unique.map(order =>
						Array.from(order, b => arena.NAMES[b]).join(' → ')
					).join('\n');
			};

			//モード切り替え
			modeRadios.forEach(radio => {
				radio.onchange = () => {
					updateBossList();
					update();
				};
			});

			select.onchange = update;
			updateBossList();

			return update;
		}

		function setupHeavyLobster() {
			const input = document.querySelector('#heavy-lobster .input input');
			const preFightAdvances = document.querySelector('#heavy-lobster .preFight .advances');
			const postDashAdvances = document.querySelector('#heavy-lobster .postDash .advances');
			const postWalkAdvances = document.querySelector('#heavy-lobster .postWalk .advances');
			const preFightAdvancesMax = document.querySelector('#heavy-lobster .preFight input');
			const postDashAdvancesMax = document.querySelector('#heavy-lobster .postDash input');
			const postWalkAdvancesMax = document.querySelector('#heavy-lobster .postWalk input');

			// 進める上限の初期化
			const init = () => {
				const a = {
					preFightAdvancesMax: parseInt(preFightAdvancesMax.value) || 31,
					postDashAdvancesMax: parseInt(postDashAdvancesMax.value) || 7,
					postWalkAdvancesMax: parseInt(postWalkAdvancesMax.value) || 11,
				};
				preFightAdvancesMax.value = a.preFightAdvancesMax;
				postDashAdvancesMax.value = a.postDashAdvancesMax;
				postWalkAdvancesMax.value = a.postWalkAdvancesMax;
				return a;
			};
			preFightAdvancesMax.value = localStorage.getItem('HeavyLobster.preFightAdvancesMax');
			postDashAdvancesMax.value = localStorage.getItem('HeavyLobster.postDashAdvancesMax');
			postWalkAdvancesMax.value = localStorage.getItem('HeavyLobster.postWalkAdvancesMax');
			init();

			// 進める上限の保存
			const save = () => {
				localStorage.setItem('HeavyLobster.preFightAdvancesMax', preFightAdvancesMax.value);
				localStorage.setItem('HeavyLobster.postDashAdvancesMax', postDashAdvancesMax.value);
				localStorage.setItem('HeavyLobster.postWalkAdvancesMax', postWalkAdvancesMax.value);
			};
			preFightAdvancesMax.oninput = save;
			postDashAdvancesMax.oninput = save;
			postWalkAdvancesMax.oninput = save;

			// 進める量の計算と表示
			const update = () => {
				//文字を矢印に
				let patternText = charsToArrow(input.value);
				changeInputText(input, patternText)

				//矢印を数値に
				let additions = [0];
				let pattern = patternText.split('').flatMap(x => {
					switch (x) {
						case '+':
							additions[additions.length - 1]++;
							return [];
						case '-':
							additions[additions.length - 1]--;
							return [];
						default:
							additions.push(0);
							return [Star.NAMES.indexOf(x)];
					}
				});

				//5文字未満なら結果を非表示にして終わり
				if (pattern.length < 5) {
					preFightAdvances.textContent = '';
					postDashAdvances.textContent = '';
					postWalkAdvances.textContent = '';
					return;
				}

				// 乱数をいくつ進めるか計算
				let result = HeavyLobster.search(pattern, additions, init());

				// 結果を出力
				preFightAdvances.textContent = result.advances;
				postDashAdvances.textContent = result.postDash.advances;
				postWalkAdvances.textContent = result.postWalk.advances;

				console.log(result)
			};
			input.oninput = e => e.isComposing || update();
			addEventListener('compositionend', update)

			// ボタンで文字追加
			document.querySelectorAll('#heavy-lobster .input button').forEach(el => {
				el.onclick = () => {
					input.value += el.textContent;
					update();
				}
			});
		}

		// 初期化
		setupCorkboard();
		updateArena = setupArena();
		setupHeavyLobster();

	</script>
</body>

</html>
